name: Deploy Production

on:
  push:
    branches:
      - main

concurrency:
  group: semestersync-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy SemesterSync
    runs-on:
      - self-hosted
      - production

    steps:
      - name: Deployment started notification
        shell: bash
        run: |
          COMMIT_MESSAGE="$(git -C /var/www/semestersync log -1 --format=%s "$GITHUB_SHA" 2>/dev/null || echo "New production deployment")"

          sudo -n /usr/local/sbin/semestersync-deployment-notify \
            started \
            "$GITHUB_SHA" \
            "$GITHUB_ACTOR" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_RUN_ID" \
            "$COMMIT_MESSAGE"

      - name: Deploy latest commit
        shell: bash
        run: |
          set -euo pipefail

          cd /var/www/semestersync

          echo "Deploying GitHub commit: $GITHUB_SHA"

          git fetch --prune origin main

          # Refuse to deploy anything except the exact commit GitHub
          # says was pushed to main.
          git cat-file -e "${GITHUB_SHA}^{commit}"

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ERROR: $GITHUB_SHA is not on origin/main"
            exit 1
          fi

          # Production becomes an exact copy of this main commit.
          git reset --hard "$GITHUB_SHA"

          echo "Production source is now:"
          git log -1 --oneline

      - name: Generate build version
        shell: bash
        run: |
          set -euo pipefail

          cd /var/www/semestersync

          DATE="$(date -u +"%Y.%m.%d")"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"

          BUILD_VERSION="${DATE}.${GITHUB_RUN_NUMBER}"
          SENTRY_RELEASE="semestersync@${BUILD_VERSION}-${SHORT_SHA}"

          echo "Generated build information:"
          echo "  Build:   $BUILD_VERSION"
          echo "  Commit:  $SHORT_SHA"
          echo "  Release: $SENTRY_RELEASE"

          {
            echo "BUILD_VERSION=$BUILD_VERSION"
            echo "NEXT_PUBLIC_BUILD_VERSION=$BUILD_VERSION"
            echo "BUILD_COMMIT=$GITHUB_SHA"
            echo "NEXT_PUBLIC_BUILD_COMMIT=$SHORT_SHA"
            echo "SENTRY_RELEASE=$SENTRY_RELEASE"
          } >> "$GITHUB_ENV"

          set_env() {
            KEY="$1"
            VALUE="$2"

            if grep -q "^${KEY}=" .env; then
              sed -i "s|^${KEY}=.*|${KEY}=${VALUE}|" .env
            else
              printf '%s=%s\n' "$KEY" "$VALUE" >> .env
            fi
          }

            set_env "BUILD_VERSION" "$BUILD_VERSION"
            set_env "NEXT_PUBLIC_BUILD_VERSION" "$BUILD_VERSION"
            set_env "BUILD_COMMIT" "$GITHUB_SHA"
            set_env "NEXT_PUBLIC_BUILD_COMMIT" "$SHORT_SHA"
            set_env "SENTRY_RELEASE" "$SENTRY_RELEASE"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd /var/www/semestersync
          pnpm install --frozen-lockfile

      - name: Build production
        shell: bash
        run: |
          set -euo pipefail

          cd /var/www/semestersync

          set -a
          source .env
          set +a

          echo "Build version: $BUILD_VERSION"
          echo "Sentry release: $SENTRY_RELEASE"

          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "ERROR: SENTRY_AUTH_TOKEN is not available"
            exit 1
          fi
          
          pnpm build

      - name: Restart production
        shell: bash
        run: |
          set -euo pipefail

          sudo -n /usr/bin/systemctl restart semestersync
          sleep 2
          sudo -n /usr/bin/systemctl is-active semestersync

      - name: Verify deployed commit
        shell: bash
        run: |
          set -euo pipefail

          cd /var/www/semestersync

          DEPLOYED_SHA="$(git rev-parse HEAD)"

          echo "GitHub SHA:    $GITHUB_SHA"
          echo "Deployed SHA: $DEPLOYED_SHA"

          test "$DEPLOYED_SHA" = "$GITHUB_SHA"

      - name: Verify local application
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking local Next.js application..."

          for attempt in {1..10}; do
            if curl -fsS --max-time 5 \
              http://127.0.0.1:3000 >/dev/null; then

              echo "Local Next.js application is healthy."
              exit 0
            fi

            echo "Attempt $attempt/10 failed. Retrying..."
            sleep 3
          done

          echo "ERROR: Local Next.js application failed health check."
          exit 1

      - name: Verify public website
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking https://semestersync.org..."

          for attempt in {1..10}; do
            if curl -fsS --max-time 10 \
              https://semestersync.org >/dev/null; then

              echo "Public website is healthy."
              exit 0
            fi

            echo "Attempt $attempt/10 failed. Retrying..."
            sleep 3
          done

          echo "ERROR: Public website failed health check."
          exit 1

      - name: Deployment success notification
        if: success()
        shell: bash
        run: |
          COMMIT_MESSAGE="$(git -C /var/www/semestersync log -1 --format=%s "$GITHUB_SHA" 2>/dev/null || echo "Production deployment")"

          sudo -n /usr/local/sbin/semestersync-deployment-notify \
            success \
            "$GITHUB_SHA" \
            "$GITHUB_ACTOR" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_RUN_ID" \
            "$COMMIT_MESSAGE"

      - name: Deployment failure notification
        if: failure()
        shell: bash
        run: |
          COMMIT_MESSAGE="$(git -C /var/www/semestersync log -1 --format=%s "$GITHUB_SHA" 2>/dev/null || echo "Production deployment")"

          sudo -n /usr/local/sbin/semestersync-deployment-notify \
            failure \
            "$GITHUB_SHA" \
            "$GITHUB_ACTOR" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_RUN_ID" \
            "$COMMIT_MESSAGE"
